# config for prompt_bridge
/**:
  ros__parameters:
    loop_rate: 10.0
    frame_id: prompt_bridge
    cached_transactions: 10
    offer_service: true
    use_scheme: false
    prompt_provider_plugin: prompt_provider::RestPromptProvider
    
    # provider config
    RestPromptProvider:
      uri: http://10.0.0.246:11434/api/generate
      # uri: http://ollama:11434/api/generate docker container with name 'ollama'
      # uri: http://ollama:11434/v1/completions (oai api compat version)
      method: POST
      auth_type: Bearer
